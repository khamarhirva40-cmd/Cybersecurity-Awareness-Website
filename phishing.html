
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Awareness Quiz | CyberShield</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .quiz-container {
            max-width: 850px;
            margin: 45px auto;
            padding: 25px;
        }

        .quiz-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .quiz-heading h1 {
            font-size: 34px;
            margin-bottom: 12px;
        }

        .quiz-heading h1 span {
            color: var(--blue);
        }

        .quiz-heading p {
            color: var(--muted);
        }

        .question-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 22px;
        }

        .question-number {
            color: var(--blue);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .message-example {
            background: #091321;
            border: 1px solid #35465f;
            border-radius: 8px;
            padding: 17px;
            margin: 18px 0;
            overflow-wrap: anywhere;
        }

        .message-example p {
            margin: 5px 0;
        }

        .answer-options {
            display: grid;
            gap: 10px;
            margin-top: 18px;
        }

        .answer-btn {
            text-align: left;
            background: #172b43;
            color: var(--text);
            border: 1px solid #40536d;
            border-radius: 8px;
            padding: 13px;
            cursor: pointer;
            font: inherit;
        }

        .answer-btn:hover:not(:disabled) {
            border-color: var(--blue);
        }

        .answer-btn:disabled {
            cursor: default;
            opacity: 0.85;
        }

        .answer-btn.correct {
            border-color: #34d399;
            background: #12352f;
        }

        .answer-btn.incorrect {
            border-color: #fb7185;
            background: #40202b;
        }

        .feedback {
            margin-top: 15px;
            padding: 13px;
            border-radius: 8px;
            background: #0b192b;
            color: var(--muted);
        }

        .quiz-actions {
            text-align: center;
            margin: 30px 0;
        }

        .quiz-result {
            display: none;
            text-align: center;
            padding: 25px;
            background: var(--panel);
            border: 1px solid var(--blue);
            border-radius: 14px;
            margin: 25px 0;
        }

        .quiz-result h2 {
            color: var(--blue);
            font-size: 30px;
        }

        .back-link {
            display: inline-block;
            color: var(--blue);
            margin-top: 18px;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="logo">🛡 Cyber<span>Shield</span></a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#quiz">Quiz</a>
        </div>
    </nav>

    <main class="quiz-container" id="quiz">

        <div class="quiz-heading">
            <p class="tagline">INTERACTIVE SECURITY TRAINING</p>
            <h1>Phishing <span>Awareness Quiz</span></h1>
            <p>
                Examine each message and decide whether it is
                suspicious or legitimate. Learn from every answer.
            </p>
        </div>

        <div id="questions"></div>

        <div class="quiz-actions">
            <button class="btn primary" id="finishBtn" onclick="finishQuiz()">
                View Final Score
            </button>
        </div>

        <div class="quiz-result" id="result" aria-live="polite">
            <h2 id="score"></h2>
            <p id="resultMessage"></p>
            <button class="btn primary" onclick="restartQuiz()">
                Try Again
            </button>
            <br>
            <a href="index.html" class="back-link">← Back to Home</a>
        </div>

    </main>

    <footer>
        <a href="index.html" class="logo">🛡 Cyber<span>Shield</span></a>
        <p>Cybersecurity Awareness Among College Students</p>
    </footer>

    <script>
        const quizData = [
            {
                message: "Your bank account will be blocked in 10 minutes! Click this unfamiliar link to verify your account immediately.",
                sender: "Unknown sender",
                options: [
                    "Suspicious / Possible phishing",
                    "Legitimate message"
                ],
                answer: 0,
                explanation: "Urgency, threats, and an unfamiliar link are warning signs. Do not click; verify through the bank's official app or website."
            },
            {
                message: "Your college has announced an examination timetable. Open your usual college portal directly to view the schedule.",
                sender: "Example college notice",
                options: [
                    "Suspicious / Possible phishing",
                    "Legitimate-looking notice"
                ],
                answer: 1,
                explanation: "This message contains no obvious demand for sensitive information. However, the sender and notice should still be verified through the official college portal."
            },
            {
                message: "Congratulations! You won a free smartphone. Pay a small delivery fee now using this unfamiliar payment link.",
                sender: "Unknown promotional account",
                options: [
                    "Suspicious / Possible phishing",
                    "Legitimate offer"
                ],
                answer: 0,
                explanation: "Unexpected prizes combined with payment requests and unfamiliar links are common scam indicators."
            },
            {
                message: "A caller claims to be from technical support and asks you to reveal your account password to fix a security problem.",
                sender: "Unverified caller",
                options: [
                    "Suspicious request",
                    "Safe support procedure"
                ],
                answer: 0,
                explanation: "Never reveal your password to a caller. Contact the service provider using its official support channel."
            },
            {
                message: "You receive a message from a friend asking for money urgently. The writing style seems unusual and the account sends a payment QR code.",
                sender: "Friend's account",
                options: [
                    "Send money immediately",
                    "Verify independently first"
                ],
                answer: 1,
                explanation: "Accounts can be compromised. Contact your friend through a separate, trusted channel before sending money."
            }
        ];

        let score = 0;
        let answered = 0;
        let finished = false;

        function loadQuiz() {
            const container = document.getElementById("questions");

            container.innerHTML = quizData.map((q, index) => `
                <section class="question-card" id="question-${index}">
                    <p class="question-number">QUESTION ${index + 1} OF ${quizData.length}</p>

                    <div class="message-example">
                        <p><strong>Sender:</strong> ${q.sender}</p>
                        <p>${q.message}</p>
                    </div>

                    <h3>What should you do?</h3>

                    <div class="answer-options">
                        ${q.options.map((option, optionIndex) => `
                            <button class="answer-btn"
                                onclick="selectAnswer(${index}, ${optionIndex}, this)">
                                ${option}
                            </button>
                        `).join("")}
                    </div>

                    <div class="feedback" id="feedback-${index}" hidden></div>
                </section>
            `).join("");
        }

        function selectAnswer(questionIndex, optionIndex, button) {
            if (finished) return;

            const feedback = document.getElementById("feedback-" + questionIndex);

            if (!feedback.hidden) return;

            const question = quizData[questionIndex];
            const buttons = document.querySelectorAll(
                "#question-" + questionIndex + " .answer-btn"
            );

            buttons.forEach(btn => btn.disabled = true);

            answered++;

            if (optionIndex === question.answer) {
                score++;
                button.classList.add("correct");
                feedback.textContent = "Correct! " + question.explanation;
            } else {
                button.classList.add("incorrect");
                buttons[question.answer].classList.add("correct");
                feedback.textContent = "Not quite. " + question.explanation;
            }

            feedback.hidden = false;
        }

        function finishQuiz() {
            if (finished) return;

            finished = true;

            document.querySelectorAll(".answer-btn").forEach(btn => {
                btn.disabled = true;
            });

            document.getElementById("score").textContent =
                "Your Score: " + score + " / " + quizData.length;

            document.getElementById("resultMessage").textContent =
                answered < quizData.length
                ? "You answered " + answered + " of " + quizData.length +
                  " questions. Unanswered questions count as incorrect. Review the explanations to learn more."
                : score === quizData.length
                ? "Excellent! You identified all the expected safe actions in these examples."
                : "Keep learning! Review the explanations and practice identifying warning signs.";

            document.getElementById("result").style.display = "block";
            document.getElementById("finishBtn").disabled = true;

            document.getElementById("result").scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }

        function restartQuiz() {
            score = 0;
            answered = 0;
            finished = false;

            document.getElementById("result").style.display = "none";
            document.getElementById("finishBtn").disabled = false;

            loadQuiz();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        loadQuiz();
    </script>

</body>
</html>
